name: Pull Request Build Check

on:
  pull_request:
    branches: [ production, main, master ]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.GATSBY_GA_MEASUREMENT_ID }}

      - name: Check build output
        run: |
          echo "✅ Build completed successfully!"
          echo "📁 Build output size: $(du -sh dist | cut -f1)"
          echo "📄 Number of pages built: $(find dist -name "*.html" | wc -l)"
